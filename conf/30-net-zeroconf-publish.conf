# pipewire-net-zeroconf — publish side.
#
# Exposes local audio sinks (and, optionally, sources) to LAN peers via
# Avahi (mDNS) under _pipewire-rtp._udp. Loads no discover side here —
# see 31-net-zeroconf-discover.conf for that.
#
# To disable just this side without touching discover:
#   sudo rm /usr/share/pipewire/pipewire.conf.d/30-net-zeroconf-publish.conf
# Or, to override options without touching the system file, copy this file
# to ~/.config/pipewire/pipewire.conf.d/ and edit there — the user copy
# REPLACES the system copy of the same filename.

context.modules = [
    {   name = libpipewire-module-mdns-rtp-publish
        args = {
            # Toggle which kinds of local nodes we offer to the network.
            publish.sink   = true
            publish.source = false

            # Audio format negotiated with peers.
            # Anything PipeWire's RTP modules accept is fine; if your peers
            # need lossless, S16BE @ 48000 is the safe pick.
            #publish.rate     = 48000
            #publish.channels = 2
            #publish.format   = "S16BE"   # S16BE | S24BE | S32BE
            #publish.codec    = "pcm"     # pcm | opus

            # Packet timing. Default ptime=5ms keeps each RTP packet
            # under the standard 1280-byte MTU for stereo 16-bit @ 48kHz
            # (5ms × 48000 × 2ch × 2B ≈ 960 B audio + ~40 B headers).
            # Going to 10ms forces IP fragmentation = crackle. If your
            # LAN supports jumbo frames you may raise both ptime and MTU.
            # Latency must remain an integer multiple of ptime.
            #publish.ptime.msec   = 5
            #publish.latency.msec = 200

            # Port allocation. Each published card gets one UDP port from
            # [publish.port.base, publish.port.base + publish.port.range).
            # Default range of 32 keeps the firewall rule small. If a single
            # fixed port is needed (only one publishable card), set publish.port.
            #publish.port.base  = 46000
            #publish.port.range = 32
            #publish.port       = 46000   # fixed; only the first card gets it

            # Transport. unicast (default) takes peer address from Avahi
            # resolve; multicast advertises a group address in TXT so any
            # peer on the LAN joining the group will receive the stream.
            #publish.transport       = "unicast"        # unicast | multicast
            #publish.multicast.ip    = "224.0.0.56"     # used if transport=multicast
            #publish.multicast.port  = 5004             # RTP-standard, base for allocation
            #publish.multicast.ttl   = 1
            #publish.multicast.loop  = false

            # Additionally announce sessions via SAP (RFC 2974) so VLC and
            # other generic RTP receivers can pick the stream up automatically.
            # Multicast only (no-op for unicast).
            #publish.sap = false
        }
        flags = [ ifexists nofail ]
    }
]
