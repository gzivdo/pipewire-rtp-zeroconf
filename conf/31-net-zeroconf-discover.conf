# pipewire-net-zeroconf — discover side.
#
# Browses Avahi for LAN peers publishing _pipewire-rtp._udp services and
# makes each remote card appear locally as a virtual Audio/Sink (or
# Audio/Source if discover.source=true).
#
# This package being installed implies you want discover. To override
# options without touching the system file, copy this file to
# ~/.config/pipewire/pipewire.conf.d/ and edit there.
# To disable entirely: `sudo apt remove pipewire-net-zeroconf-discover`.

context.modules = [
    {   name = libpipewire-module-mdns-rtp-discover
        args = {
            discover.sink   = true
            discover.source = false

            # IPv4 by default. The publish side binds to 0.0.0.0 (IPv4-only),
            # so mixing in IPv6 makes traffic vanish into the wrong socket.
            # Set to "any" if your peer has IPv4 disabled.
            #discover.protocol = "ipv4"   # ipv4 | ipv6 | any

            # Packet timing — match publish-side defaults (5ms ptime fits
            # one packet under 1280-byte MTU at stereo 16-bit @ 48 kHz).
            # Latency must remain an integer multiple of ptime.
            #discover.ptime.msec   = 5
            #discover.latency.msec = 200

            # Useful when testing two pipewire daemons on the same host:
            #discover.local = true
        }
        flags = [ ifexists nofail ]
    }
]
