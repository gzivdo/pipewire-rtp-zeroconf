name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-deb:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: build (ubuntu-24.04)
            container: ''
            os_tag: ubuntu-24.04
          - label: build (ubuntu-26.04 via container)
            container: ubuntu:26.04
            os_tag: ubuntu-26.04
    container: ${{ matrix.container }}
    steps:
      - name: bootstrap container (root, no sudo yet)
        if: matrix.container != ''
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl gnupg git sudo

      - uses: actions/checkout@v5

      - name: install build deps
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            devscripts debhelper dpkg-dev fakeroot build-essential \
            meson ninja-build pkgconf \
            libpipewire-0.3-dev libspa-0.2-dev libavahi-client-dev

      - name: dpkg-buildpackage
        run: dpkg-buildpackage -us -uc -b

      - name: stage debs with os suffix
        run: |
          mkdir -p stage
          for f in ../pipewire-rtp-zeroconf*_*.deb; do
            base=$(basename "$f" .deb)
            cp "$f" "stage/${base}_${{ matrix.os_tag }}.deb"
          done
          ls -la stage/

      - uses: actions/upload-artifact@v5
        with:
          name: debs-${{ matrix.os_tag }}
          path: stage/*.deb
          if-no-files-found: error

  publish:
    name: publish release
    needs: build-deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: debs-*
          merge-multiple: true

      - name: list collected debs
        run: ls -la artifacts/

      - name: extract changelog entry for tag
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          awk -v ver="$tag" '
            $0 ~ "^pipewire-rtp-zeroconf \\("ver"-" {flag=1; next}
            flag && /^ -- / {flag=0}
            flag {print}
          ' debian/changelog > notes.md
          if [ ! -s notes.md ]; then
            echo "no debian/changelog entry for v$tag — release notes will be empty"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: notes.md
          files: artifacts/*.deb
          generate_release_notes: false
          draft: false
          prerelease: false
