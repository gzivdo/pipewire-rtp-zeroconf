name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native 24.04 — fast path, PipeWire 1.0.x.
          - label: build (ubuntu-24.04)
            container: ''
            os_tag: ubuntu-24.04
          # 26.04 via container so we don't depend on GitHub shipping a
          # native runner. ubuntu:26.04 (resolute) has PipeWire 1.6.x.
          - label: build (ubuntu-26.04 via container)
            container: ubuntu:26.04
            os_tag: ubuntu-26.04
    container: ${{ matrix.container }}
    steps:
      - name: bootstrap container (root, no sudo yet)
        if: matrix.container != ''
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl gnupg git sudo

      - uses: actions/checkout@v5

      - name: install build deps
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            devscripts debhelper dpkg-dev fakeroot build-essential \
            meson ninja-build pkgconf \
            libpipewire-0.3-dev libspa-0.2-dev libavahi-client-dev

      - name: dpkg-buildpackage
        # debian/rules → meson → ninja. SPA headers emit warnings we
        # can't suppress, so warnings != failure.
        run: dpkg-buildpackage -us -uc -b

      - name: collect debs and sanity-check exports
        run: |
          mkdir -p artifacts
          mv ../pipewire-rtp-zeroconf*_*.deb artifacts/
          ls -la artifacts/
          for deb in artifacts/pipewire-rtp-zeroconf-publish_*.deb \
                     artifacts/pipewire-rtp-zeroconf-discover_*.deb; do
            dpkg-deb -x "$deb" extract
          done
          for so in extract/usr/lib/*/pipewire-0.3/libpipewire-module-mdns-rtp-*.so; do
            file "$so"
            nm -D "$so" | grep -q pipewire__module_init || \
              { echo "$so: missing pipewire__module_init export"; exit 1; }
          done

      - uses: actions/upload-artifact@v5
        with:
          name: debs-${{ matrix.os_tag }}
          path: artifacts/*.deb
          if-no-files-found: error
