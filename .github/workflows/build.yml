name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 ships PipeWire 1.0.x.
        # TODO: add ubuntu-26.04 once GitHub Actions ships the runner —
        # the SPA/PW API is ABI-stable to 1.6.x so the same source
        # should build cleanly there, we just can't verify in CI yet.
        os: [ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4

      - name: install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            devscripts debhelper dpkg-dev fakeroot build-essential \
            meson ninja-build pkgconf \
            libpipewire-0.3-dev libspa-0.2-dev libavahi-client-dev

      - name: dpkg-buildpackage
        # Builds .deb via debian/rules → meson → ninja. SPA headers
        # emit -Wmissing-field-initializers / -Wunused-parameter that we
        # can't suppress, so warnings != failure.
        run: dpkg-buildpackage -us -uc -b

      - name: collect debs and sanity-check exports
        run: |
          mkdir -p artifacts
          mv ../pipewire-rtp-zeroconf*_*.deb artifacts/
          ls -la artifacts/
          # Verify the published .so actually loads as a PW module.
          for deb in artifacts/pipewire-rtp-zeroconf-{publish,discover}_*.deb; do
            dpkg-deb -x "$deb" extract
          done
          for so in extract/usr/lib/*/pipewire-0.3/libpipewire-module-mdns-rtp-*.so; do
            file "$so"
            nm -D "$so" | grep -q pipewire__module_init || \
              { echo "$so: missing pipewire__module_init export"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.os }}
          path: artifacts/*.deb
          if-no-files-found: error
